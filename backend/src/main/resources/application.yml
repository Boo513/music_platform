server:
  port: 8080

logging:
  pattern:
    # 显式指定 Asia/Shanghai，避免容器内 JVM 默认 UTC 导致日志时间慢 8 小时
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Shanghai} %-5level [%thread] %logger{36} - %msg%n"

spring:
  datasource:
    # 本地开发默认连 localhost；Docker 部署由 docker-compose.yml 注入 SPRING_DATASOURCE_URL 覆盖为 jdbc:mysql://mysql:3306/...
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/music_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      resolve-lazily: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.musicplatform.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:YourSuperSecretKeyForJWT512BitsMinLengthChangeThisInProduction!!!}
    expiration-days: 7
  upload:
    audio-dir: uploads/audio
    cover-dir: uploads/covers
    video-dir: uploads/videos
