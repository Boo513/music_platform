name: music-platform

services:
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: music_platform
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - music-net

  backend:
    build: ./backend
    container_name: music-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-YourSuperSecretKeyForJWT512BitsMinLengthChangeThisInProduction!!!}
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    networks:
      - music-net

  frontend:
    build: ./frontend
    container_name: music-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # CentOS7 kernel 3.10 下 Nginx 的 pwrite() 写 pid 文件会被默认 seccomp 拦截
    security_opt:
      - seccomp:unconfined
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - music-net

  certbot:
    image: certbot/certbot
    container_name: music-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${BASHPID:-$$}; done;'
    networks:
      - music-net

volumes:
  mysql_data:
  uploads_data:
  certbot_conf:
  certbot_www:

networks:
  music-net:
    driver: bridge
